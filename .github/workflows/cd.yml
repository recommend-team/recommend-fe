name: Continuous Deployment

on:
  push:
    branches: [staging, main]

jobs:
  deploy:
    name: CD - Deploy
    runs-on: ubuntu-latest

    # The build needs these: api.ts refuses a production build without an API URL, and
    # links.ts disables the buttons without the app URLs. Set them as repository
    # variables (Settings → Secrets and variables → Actions → Variables) to override;
    # otherwise the build is checked against staging.
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://recommend-staging.onrender.com/api/v1' }}
      NEXT_PUBLIC_CUSTOMER_APP_URL: ${{ vars.NEXT_PUBLIC_CUSTOMER_APP_URL || 'https://recommend-customer-app.netlify.app' }}
      NEXT_PUBLIC_VENDOR_APP_URL: ${{ vars.NEXT_PUBLIC_VENDOR_APP_URL || 'https://recommend-vendors.netlify .app' }}

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Install pnpm — the version pinned in package.json's "packageManager", so the
      #    cache below finds the store this pnpm actually uses.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # 3. Setup Node.js with pnpm cache
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      # 4. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Build Next.js app
      - name: Build
        run: pnpm build

      # 6. Deploy to Production (main branch)
      # - name: Deploy to Production
      #   if: github.ref == 'refs/heads/main'
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     vercel-args: '--prod'

      # 7. Deploy to Staging (staging branch)
      # - name: Deploy to Staging
      #   if: github.ref == 'refs/heads/staging'
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_STAGING }}
