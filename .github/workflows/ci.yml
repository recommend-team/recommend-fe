name: Continuous Integration

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]

jobs:
  ci:
    name: CI - Build & Test
    runs-on: ubuntu-latest

    # The build needs these: api.ts refuses a production build without an API URL, and
    # links.ts disables the buttons without the app URLs. Set them as repository
    # variables (Settings → Secrets and variables → Actions → Variables) to override;
    # otherwise the build is checked against staging.
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://recommend-staging.onrender.com/api/v1' }}
      NEXT_PUBLIC_CUSTOMER_APP_URL: ${{ vars.NEXT_PUBLIC_CUSTOMER_APP_URL || 'https://recommend-customer-app.vercel.app' }}
      NEXT_PUBLIC_VENDOR_APP_URL: ${{ vars.NEXT_PUBLIC_VENDOR_APP_URL || 'https://recommend-vendors.vercel.app' }}

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Install pnpm — the version pinned in package.json's "packageManager", so the
      #    cache below finds the store this pnpm actually uses.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # 3. Setup Node.js with pnpm cache
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Lint code
      - name: Lint
        run: pnpm lint

      # 5. Type check
      - name: Type Check
        run: pnpm tsc --noEmit

      # 6. Unit & Integration tests
      - name: Run Tests
        run: pnpm test --coverage

      # 7. Build Next.js app
      - name: Build
        run: pnpm build

      # 8. Upload coverage reports (optional)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
